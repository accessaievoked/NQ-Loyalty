# Local / self-hosted stack. Postgres lives on Neon (DATABASE_URL in .env).
#
# One service. The web app also runs the background jobs (delayed point releases, queued emails,
# 6-hourly maintenance) in the same process: the database is the queue, so there is no Redis and no
# separate worker to run.
#
#   docker compose up --build
services:
  app:
    build: .
    env_file: .env
    environment:
      PORT: "3000"
    ports:
      - "3000:3000"
    restart: unless-stopped
