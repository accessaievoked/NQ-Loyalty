# fly.toml app configuration file generated for nq-loyalty-claura on 2026-11-16T18:21:16+05:30
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'nq-loyalty-claura'
primary_region = 'iad'

[build]
[env]
  NODE_ENV = 'production'
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
